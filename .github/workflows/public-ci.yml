name: public-ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
            python-version: "3.12"
          - os: ubuntu-latest
            runner: ubuntu-24.04
            python-version: "3.13"
          - os: windows-latest
            runner: windows-latest
            python-version: "3.12"
          - os: windows-latest
            runner: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - name: Verify release version consistency
        run: python scripts/version_consistency_smoke.py
      - name: Verify documentation/runtime contract consistency
        run: python scripts/documentation_consistency_smoke.py
      - name: Verify dependency lock consistency
        run: python scripts/dependency_lock_smoke.py
      - name: Verify packaged runtime dependency manifest
        run: python scripts/runtime_dependency_manifest.py --check
      - name: Verify generated release metadata
        run: python scripts/release_metadata.py --check --public
      - name: Verify published file hashes
        run: python scripts/verify_public_manifest.py
      - name: Verify architecture boundaries
        run: python scripts/architecture_review.py
      - name: Verify public submission readiness
        run: python scripts/submission_readiness_smoke.py --public
      - name: Run public regression suite
        env:
          VULNFLOW_PUBLIC_TEST_GROUP_TIMEOUT_SECONDS: "360"
        run: python scripts/run_public_tests.py
      - name: Build exact-tree Windows release candidate
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.13'
        run: >-
          python scripts/build_public_release_archive.py
          --json-output reports/release_candidate_archive.json
      - name: Retain exact-tree Windows release candidate
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-candidate-windows-${{ github.sha }}
          path: |
            dist/VulnFlow_Free_Public_Beta_Windows_Core_*.zip
            reports/release_candidate_archive.json
          if-no-files-found: error


  coverage-gate:
    name: coverage / Python 3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - name: Run application line coverage gate
        run: python scripts/coverage_verification.py
      - name: Retain coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-report
          path: |
            reports/coverage_verification.txt
            reports/coverage_verification_summary.txt
            reports/coverage_verification_summary.json
            reports/coverage.json
            reports/coverage.xml
            reports/coverage_pytest_group_*.txt
            reports/coverage_smoke_*.txt
          if-no-files-found: warn

  dependency-wheelhouse:
    name: dependency-wheelhouse / clean offline reinstall
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - name: Download pinned wheels and reinstall without an index
        run: >-
          python scripts/dependency_wheelhouse_rehearsal.py
          --json-output reports/dependency_wheelhouse_rehearsal.json
      - name: Retain wheelhouse artifact hashes and clean-install result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-wheelhouse-report
          path: reports/dependency_wheelhouse_rehearsal.json
          if-no-files-found: warn

  production-validation:
    name: production-validation / Docker upgrade and production Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - name: Run schema upgrade, scanner matrix, and Docker readiness rehearsal
        run: python scripts/production_validation.py --docker required --json-output reports/production_validation.json
      - name: Run production Compose TLS topology rehearsal
        run: python scripts/production_compose_rehearsal.py --require-docker --json-output reports/production_compose_rehearsal.json


  runtime-resilience:
    name: runtime-resilience / Windows Python 3.13
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - name: Run bounded SQLite fault and recovery rehearsal
        run: >-
          python scripts/runtime_fault_rehearsal.py
          --workers 4
          --writes-per-worker 8
          --json-output reports/runtime_fault_rehearsal_verification.json
          --text-output reports/runtime_fault_rehearsal_verification.txt
      - name: Run 12-cycle runtime stability soak
        run: >-
          python scripts/runtime_stability_soak.py
          --iterations 12
          --json-output reports/runtime_stability_soak_verification.json
          --text-output reports/runtime_stability_soak_verification.txt
      - name: Run real Uvicorn HTTP smoke
        run: python scripts/uvicorn_smoke.py
      - name: Retain runtime resilience evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: runtime-resilience-windows-py313
          path: |
            reports/runtime_fault_rehearsal_verification.json
            reports/runtime_fault_rehearsal_verification.txt
            reports/runtime_stability_soak_verification.json
            reports/runtime_stability_soak_verification.txt
          if-no-files-found: warn

  quality-gates:
    name: static-quality / Python 3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-quality.txt
      - name: Run static quality and dependency gates
        run: python scripts/run_quality_gates.py

  browser-e2e:
    name: browser-e2e / Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-e2e.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-e2e.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser workflow E2E
        run: python scripts/run_browser_e2e.py


  publish-release:
    name: publish-release / exact main candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: vulnflow-public-release
      cancel-in-progress: false
    needs:
      - core-tests
      - coverage-gate
      - dependency-wheelhouse
      - production-validation
      - runtime-resilience
      - quality-gates
      - browser-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Check whether this version is already published
        id: release
        shell: bash
        run: |
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "${GITHUB_SHA}^" "${GITHUB_SHA}" -- VERSION; then
            echo "::error::Unpublished version $version may only be published from the main commit that changes VERSION."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Wait for required CodeQL analyses
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time

          wanted = {"Analyze (actions)", "Analyze (python)"}
          repo = os.environ["GH_REPO"]
          sha = os.environ["TARGET_SHA"]
          deadline = time.time() + 600
          while time.time() < deadline:
              raw = subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/commits/{sha}/check-runs?per_page=100"],
                  text=True,
              )
              payload = json.loads(raw)
              checks = {
                  item.get("name"): (item.get("status"), item.get("conclusion"))
                  for item in payload.get("check_runs", [])
                  if item.get("name") in wanted
              }
              failed = {
                  name: state
                  for name, state in checks.items()
                  if state[0] == "completed" and state[1] != "success"
              }
              if failed:
                  raise SystemExit(f"CodeQL required check failed: {failed}")
              if all(checks.get(name) == ("completed", "success") for name in wanted):
                  print("required CodeQL analyses: PASS")
                  break
              time.sleep(15)
          else:
              raise SystemExit(f"timed out waiting for CodeQL: {checks}")
          PY
      - name: Build and verify release asset
        if: steps.release.outputs.publish == 'true'
        run: >-
          python scripts/build_public_release_archive.py
          --json-output reports/release_candidate_archive.json
      - name: Create annotated release tag
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" "${GITHUB_SHA}" -m "VulnFlow Free Public Beta $VERSION"
          git push origin "refs/tags/v$VERSION"
      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          asset="dist/VulnFlow_Free_Public_Beta_Windows_Core_$VERSION.zip"
          notes="RELEASE_NOTES_$VERSION.md"
          test -f "$asset"
          test -f "$notes"
          gh release create "v$VERSION" "$asset" --verify-tag \
            --title "VulnFlow Free - Public Beta (Core $VERSION)" \
            --notes-file "$notes"
      - name: Verify published release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release view "v$VERSION" --json tagName,isDraft,isPrerelease,url
          sha256sum "dist/VulnFlow_Free_Public_Beta_Windows_Core_$VERSION.zip"
