name: public-ci

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Verify published file hashes
        run: python scripts/verify_public_manifest.py
      - name: Verify architecture boundaries
        run: python scripts/architecture_review.py
      - name: Verify public submission readiness
        run: python scripts/submission_readiness_smoke.py --public
      - name: Run public regression suite
        run: python scripts/run_public_tests.py
