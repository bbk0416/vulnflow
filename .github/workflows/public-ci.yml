name: public-ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - name: Verify release version consistency
        run: python scripts/version_consistency_smoke.py
      - name: Verify documentation/runtime contract consistency
        run: python scripts/documentation_consistency_smoke.py
      - name: Verify dependency lock consistency
        run: python scripts/dependency_lock_smoke.py
      - name: Verify packaged runtime dependency manifest
        run: python scripts/runtime_dependency_manifest.py --check
      - name: Verify generated release metadata
        run: python scripts/release_metadata.py --check --public
      - name: Verify published file hashes
        run: python scripts/verify_public_manifest.py
      - name: Verify architecture boundaries
        run: python scripts/architecture_review.py
      - name: Verify public submission readiness
        run: python scripts/submission_readiness_smoke.py --public
      - name: Run public regression suite
        env:
          VULNFLOW_PUBLIC_TEST_GROUP_TIMEOUT_SECONDS: "360"
        run: python scripts/run_public_tests.py

  dependency-wheelhouse:
    name: dependency-wheelhouse / clean offline reinstall
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - name: Download pinned wheels and reinstall without an index
        run: >-
          python scripts/dependency_wheelhouse_rehearsal.py
          --json-output reports/dependency_wheelhouse_rehearsal.json
      - name: Retain wheelhouse artifact hashes and clean-install result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-wheelhouse-report
          path: reports/dependency_wheelhouse_rehearsal.json
          if-no-files-found: warn

  production-validation:
    name: production-validation / Docker upgrade and production Compose
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - name: Run schema upgrade, scanner matrix, and Docker readiness rehearsal
        run: python scripts/production_validation.py --docker required --json-output reports/production_validation.json
      - name: Run production Compose TLS topology rehearsal
        run: python scripts/production_compose_rehearsal.py --require-docker --json-output reports/production_compose_rehearsal.json

  quality-gates:
    name: static-quality / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-quality.txt
      - name: Run static quality and dependency gates
        run: python scripts/run_quality_gates.py

  browser-e2e:
    name: browser-e2e / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-e2e.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-e2e.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser workflow E2E
        run: python scripts/run_browser_e2e.py
