services:
  vulnflow:
    build: .
    image: "${VULNFLOW_IMAGE:-vulnflow:72.0.13}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - vulnflow-data:/app/data
    environment:
      VULNFLOW_ALLOW_LOCAL_ADMIN_FALLBACK: "${VULNFLOW_ALLOW_LOCAL_ADMIN_FALLBACK:-0}"
      VULNFLOW_USERS_JSON: "${VULNFLOW_USERS_JSON:-}"
      VULNFLOW_API_TOKENS_JSON: "${VULNFLOW_API_TOKENS_JSON:-}"
      VULNFLOW_AUTH_USER: "${VULNFLOW_AUTH_USER:-}"
      VULNFLOW_AUTH_PASSWORD: "${VULNFLOW_AUTH_PASSWORD:-}"
      VULNFLOW_COOKIE_SECURE: "0"
      VULNFLOW_WEBHOOKS_JSON: "${VULNFLOW_WEBHOOKS_JSON:-}"
      VULNFLOW_WEBHOOK_INTERVAL_SECONDS: "${VULNFLOW_WEBHOOK_INTERVAL_SECONDS:-15}"
      VULNFLOW_WEBHOOK_TIMEOUT_SECONDS: "${VULNFLOW_WEBHOOK_TIMEOUT_SECONDS:-10}"
      VULNFLOW_WEBHOOK_MAX_ATTEMPTS: "${VULNFLOW_WEBHOOK_MAX_ATTEMPTS:-5}"
      VULNFLOW_WEBHOOK_ALLOW_INSECURE_HTTP: "${VULNFLOW_WEBHOOK_ALLOW_INSECURE_HTTP:-0}"
      VULNFLOW_WEBHOOK_RETENTION_DAYS: "${VULNFLOW_WEBHOOK_RETENTION_DAYS:-0}"
      VULNFLOW_LOG_LEVEL: "${VULNFLOW_LOG_LEVEL:-INFO}"
      VULNFLOW_MAINTENANCE_INTERVAL_MINUTES: "${VULNFLOW_MAINTENANCE_INTERVAL_MINUTES:-0}"
      VULNFLOW_AUDIT_RETENTION_DAYS: "${VULNFLOW_AUDIT_RETENTION_DAYS:-0}"
      VULNFLOW_IMPORT_RETENTION_DAYS: "${VULNFLOW_IMPORT_RETENTION_DAYS:-0}"
      VULNFLOW_AUTO_ARCHIVE_STALE_DAYS: "${VULNFLOW_AUTO_ARCHIVE_STALE_DAYS:-0}"
      VULNFLOW_JOB_WORKER_ENABLED: "${VULNFLOW_JOB_WORKER_ENABLED:-1}"
      VULNFLOW_JOB_WORKER_INTERVAL_SECONDS: "${VULNFLOW_JOB_WORKER_INTERVAL_SECONDS:-2}"
      VULNFLOW_JOB_LEASE_SECONDS: "${VULNFLOW_JOB_LEASE_SECONDS:-120}"
      VULNFLOW_JOB_MAX_ATTEMPTS: "${VULNFLOW_JOB_MAX_ATTEMPTS:-3}"
      VULNFLOW_JOB_RETENTION_DAYS: "${VULNFLOW_JOB_RETENTION_DAYS:-30}"
      VULNFLOW_CLUSTER_COORDINATION_ENABLED: "${VULNFLOW_CLUSTER_COORDINATION_ENABLED:-1}"
      VULNFLOW_INSTANCE_ID: "${VULNFLOW_INSTANCE_ID:-vulnflow-compose-1}"
      VULNFLOW_INSTANCE_HEARTBEAT_SECONDS: "${VULNFLOW_INSTANCE_HEARTBEAT_SECONDS:-10}"
      VULNFLOW_INSTANCE_TTL_SECONDS: "${VULNFLOW_INSTANCE_TTL_SECONDS:-30}"
      VULNFLOW_SCHEDULER_LEASE_SECONDS: "${VULNFLOW_SCHEDULER_LEASE_SECONDS:-30}"
      VULNFLOW_EXCLUSIVE_OPERATION_LEASE_SECONDS: "${VULNFLOW_EXCLUSIVE_OPERATION_LEASE_SECONDS:-300}"
      VULNFLOW_WRITE_ACTIVITY_TTL_SECONDS: "${VULNFLOW_WRITE_ACTIVITY_TTL_SECONDS:-600}"
      VULNFLOW_COORDINATION_DB: "/app/data/vulnflow-coordination.db"
      VULNFLOW_EVIDENCE_DIR: "/app/data/evidence"
      VULNFLOW_EVIDENCE_MAX_BYTES: "${VULNFLOW_EVIDENCE_MAX_BYTES:-10485760}"
    restart: unless-stopped

volumes:
  vulnflow-data:
