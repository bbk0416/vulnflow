services:
  vulnflow:
    build: .
    image: "${VULNFLOW_IMAGE:-vulnflow:72.0.86}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - vulnflow-data:/app/data
      - vulnflow-backups:/app/external-backups
    environment:
      VULNFLOW_CONTROL_DB: "/app/data/control.db"
      VULNFLOW_DEFAULT_PROJECT_DB: "/app/data/projects/default/vulnflow.db"
      VULNFLOW_SECURITY_PROFILE: "${VULNFLOW_SECURITY_PROFILE:-pilot}"
      VULNFLOW_RUNTIME_DEPENDENCY_POLICY: "${VULNFLOW_RUNTIME_DEPENDENCY_POLICY:-off}"
      VULNFLOW_DEMO_MODE: "${VULNFLOW_DEMO_MODE:-0}"
      VULNFLOW_ALLOW_LOCAL_ADMIN_FALLBACK: "${VULNFLOW_ALLOW_LOCAL_ADMIN_FALLBACK:-0}"
      VULNFLOW_API_TOKENS_JSON: "${VULNFLOW_API_TOKENS_JSON:-}"
      VULNFLOW_AUTH_SESSION_MINUTES: "${VULNFLOW_AUTH_SESSION_MINUTES:-480}"
      VULNFLOW_AUTH_SESSION_IDLE_MINUTES: "${VULNFLOW_AUTH_SESSION_IDLE_MINUTES:-60}"
      VULNFLOW_AUTH_SESSION_BINDING: "${VULNFLOW_AUTH_SESSION_BINDING:-user-agent}"
      VULNFLOW_AUTH_MAX_ACTIVE_SESSIONS: "${VULNFLOW_AUTH_MAX_ACTIVE_SESSIONS:-10}"
      VULNFLOW_AUTH_RATE_WINDOW_SECONDS: "${VULNFLOW_AUTH_RATE_WINDOW_SECONDS:-300}"
      VULNFLOW_AUTH_RATE_USERNAME_CLIENT_ATTEMPTS: "${VULNFLOW_AUTH_RATE_USERNAME_CLIENT_ATTEMPTS:-5}"
      VULNFLOW_AUTH_RATE_CLIENT_ATTEMPTS: "${VULNFLOW_AUTH_RATE_CLIENT_ATTEMPTS:-25}"
      VULNFLOW_COOKIE_SECURE: "${VULNFLOW_COOKIE_SECURE:-1}"
      VULNFLOW_INTEGRATION_SECRET_KEY: "${VULNFLOW_INTEGRATION_SECRET_KEY:-}"
      VULNFLOW_PUBLIC_BASE_URL: "${VULNFLOW_PUBLIC_BASE_URL:-}"
      VULNFLOW_WEBHOOKS_JSON: "${VULNFLOW_WEBHOOKS_JSON:-}"
      VULNFLOW_WEBHOOK_INTERVAL_SECONDS: "${VULNFLOW_WEBHOOK_INTERVAL_SECONDS:-15}"
      VULNFLOW_WEBHOOK_TIMEOUT_SECONDS: "${VULNFLOW_WEBHOOK_TIMEOUT_SECONDS:-10}"
      VULNFLOW_WEBHOOK_MAX_ATTEMPTS: "${VULNFLOW_WEBHOOK_MAX_ATTEMPTS:-5}"
      VULNFLOW_WEBHOOK_ALLOW_INSECURE_HTTP: "${VULNFLOW_WEBHOOK_ALLOW_INSECURE_HTTP:-0}"
      VULNFLOW_OUTBOUND_ALLOW_PRIVATE_NETWORKS: "${VULNFLOW_OUTBOUND_ALLOW_PRIVATE_NETWORKS:-0}"
      VULNFLOW_OUTBOUND_HOST_ALLOWLIST: "${VULNFLOW_OUTBOUND_HOST_ALLOWLIST:-}"
      VULNFLOW_OUTBOUND_MAX_RESPONSE_BYTES: "${VULNFLOW_OUTBOUND_MAX_RESPONSE_BYTES:-1048576}"
      VULNFLOW_INTEL_TIMEOUT_SECONDS: "${VULNFLOW_INTEL_TIMEOUT_SECONDS:-30}"
      VULNFLOW_INTEL_RETRIES: "${VULNFLOW_INTEL_RETRIES:-3}"
      VULNFLOW_INTEL_MAX_RESPONSE_BYTES: "${VULNFLOW_INTEL_MAX_RESPONSE_BYTES:-8388608}"
      VULNFLOW_OSV_MAX_RESPONSE_BYTES: "${VULNFLOW_OSV_MAX_RESPONSE_BYTES:-4194304}"
      VULNFLOW_WEBHOOK_RETENTION_DAYS: "${VULNFLOW_WEBHOOK_RETENTION_DAYS:-0}"
      VULNFLOW_LOG_LEVEL: "${VULNFLOW_LOG_LEVEL:-INFO}"
      VULNFLOW_MAINTENANCE_INTERVAL_MINUTES: "${VULNFLOW_MAINTENANCE_INTERVAL_MINUTES:-0}"
      VULNFLOW_AUDIT_RETENTION_DAYS: "${VULNFLOW_AUDIT_RETENTION_DAYS:-0}"
      VULNFLOW_IMPORT_RETENTION_DAYS: "${VULNFLOW_IMPORT_RETENTION_DAYS:-0}"
      VULNFLOW_AUTO_ARCHIVE_STALE_DAYS: "${VULNFLOW_AUTO_ARCHIVE_STALE_DAYS:-0}"
      VULNFLOW_JOB_WORKER_ENABLED: "${VULNFLOW_JOB_WORKER_ENABLED:-1}"
      VULNFLOW_JOB_WORKER_INTERVAL_SECONDS: "${VULNFLOW_JOB_WORKER_INTERVAL_SECONDS:-2}"
      VULNFLOW_JOB_LEASE_SECONDS: "${VULNFLOW_JOB_LEASE_SECONDS:-120}"
      VULNFLOW_JOB_MAX_ATTEMPTS: "${VULNFLOW_JOB_MAX_ATTEMPTS:-3}"
      VULNFLOW_JOB_RETENTION_DAYS: "${VULNFLOW_JOB_RETENTION_DAYS:-30}"
      VULNFLOW_BACKUP_INTERVAL_HOURS: "${VULNFLOW_BACKUP_INTERVAL_HOURS:-0}"
      VULNFLOW_BACKUP_RETENTION_COUNT: "${VULNFLOW_BACKUP_RETENTION_COUNT:-10}"
      VULNFLOW_EXTERNAL_BACKUP_DIR: "${VULNFLOW_EXTERNAL_BACKUP_DIR:-/app/external-backups}"
      VULNFLOW_EXTERNAL_BACKUP_RETENTION_COUNT: "${VULNFLOW_EXTERNAL_BACKUP_RETENTION_COUNT:-30}"
      VULNFLOW_CLUSTER_COORDINATION_ENABLED: "${VULNFLOW_CLUSTER_COORDINATION_ENABLED:-1}"
      VULNFLOW_INSTANCE_ID: "${VULNFLOW_INSTANCE_ID:-vulnflow-compose-1}"
      VULNFLOW_INSTANCE_HEARTBEAT_SECONDS: "${VULNFLOW_INSTANCE_HEARTBEAT_SECONDS:-10}"
      VULNFLOW_INSTANCE_TTL_SECONDS: "${VULNFLOW_INSTANCE_TTL_SECONDS:-30}"
      VULNFLOW_SCHEDULER_LEASE_SECONDS: "${VULNFLOW_SCHEDULER_LEASE_SECONDS:-30}"
      VULNFLOW_EXCLUSIVE_OPERATION_LEASE_SECONDS: "${VULNFLOW_EXCLUSIVE_OPERATION_LEASE_SECONDS:-300}"
      VULNFLOW_WRITE_ACTIVITY_TTL_SECONDS: "${VULNFLOW_WRITE_ACTIVITY_TTL_SECONDS:-600}"
      VULNFLOW_COORDINATION_DB: "/app/data/vulnflow-coordination.db"
      VULNFLOW_EVIDENCE_DIR: "/app/data/projects/default/evidence"
      VULNFLOW_EVIDENCE_MAX_BYTES: "${VULNFLOW_EVIDENCE_MAX_BYTES:-10485760}"
    restart: unless-stopped

volumes:
  vulnflow-data:
  vulnflow-backups:
