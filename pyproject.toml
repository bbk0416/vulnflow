[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bbk-vulnflow"
version = "72.0.90"
description = "Single-host vulnerability management and integrity verification project"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BBK" }]
keywords = ["vulnerability-management", "security", "fastapi", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "fastapi==0.140.9",
  "starlette==1.3.1",
  "uvicorn[standard]==0.48.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.31",
  "PyYAML==6.0.3",
  "cryptography==50.0.0",
  "openpyxl==3.1.5",
]

[project.scripts]
vulnflow = "app.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.package-data]
app = [
  "templates/*.html",
  "static/*",
  "resources/*.yml",
  "resources/*.json",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

# These router modules intentionally resolve runtime dependencies through
# install_dependencies(); only their injected-global F821 findings are ignored.
[tool.ruff.lint.per-file-ignores]
"app/routers/accounts.py" = ["F821"]
"app/routers/imports.py" = ["F821"]
"app/routers/integrations.py" = ["F821"]
"app/routers/projects.py" = ["F821"]
"app/routers/trust.py" = ["F821"]
"app/routers/trust_observability.py" = ["F821"]

